  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">

// ── Status palette — same color logic as Orb file's particle colors ──
// critical    → pale red       (cousin of coral, drained / desaturated)
// attention   → warm orange    (cousin of gold)
// healthy     → soft white     (luminous cream)
// quiet       → faint blue     (cousin of sage, but cooler / quieter)
const STATUS = {
  critical:  { core: "#e8a8a4", glow: "#c8736d", halo: "rgba(200,115,109,0.55)", label: "Critical"    },
  attention: { core: "#ffd9a8", glow: "#e8a878", halo: "rgba(232,168,120,0.55)", label: "Needs you"   },
  healthy:   { core: "#fff2e6", glow: "#e8d5c0", halo: "rgba(232,213,192,0.45)", label: "Healthy"     },
  quiet:     { core: "#bdcdd4", glow: "#90a8b2", halo: "rgba(144,168,178,0.45)", label: "Quiet"       },
};

// Positions on an unevenly-spaced orbit. angle in degrees (0=right, 90=down),
// radial = distance from center as multiple of agency-orb radius
// (closer = more recent activity). size = relative scale (1 = baseline).

  { id: "maya",   name: "Maya Chen",     niche: "Fitness",           status: "healthy",   angle: 100, radial: 1.55, size: 1.08, note: "Driving +6% week lift" },
  { id: "priya",  name: "Priya Shah",    niche: "Tech reviews",      status: "healthy",   angle: 10,  radial: 1.85, size: 1.00, note: "Driving +4% week lift" },

// ── Agency orb — same crystal recipe as Trendzo Origin orb ──────────

// ── Client orb — smaller, status-colored sphere ─────────────────────
function ClientOrb({ client, x, y, base, hovered, onHover, onLeave }) {
  const palette = STATUS[client.status];
  const baseSize = base * client.size;
  const isCritical = client.status === "critical";
  const isAttention = client.status === "attention";
  const isQuiet = client.status === "quiet";

  return (
    <div
      onMouseEnter={() => onHover(client.id)}
      onMouseLeave={onLeave}
      style={{
        position: "absolute",
        left: `calc(50% + ${x}px)`,
        top: `calc(50% + ${y}px)`,
        width: baseSize, height: baseSize,
        marginLeft: -baseSize / 2, marginTop: -baseSize / 2,
        cursor: "pointer",
        zIndex: 10 + Math.round((1 - client.radial / 3) * 10),
        animation: `drift ${4 + (client.size * 2)}s ease-in-out infinite`,
        animationDelay: `${-client.angle / 60}s`,
      }}
    >
      {/* halo */}
      <div style={{
        position: "absolute", inset: -baseSize * 0.65,
        background: `radial-gradient(circle, ${palette.halo} 0%, transparent 65%)`,
        filter: "blur(2px)", pointerEvents: "none",
        opacity: isQuiet ? 0.55 : (hovered ? 1 : 0.85),
        transition: "opacity 280ms",
      }} />

      {/* sharp pulse ring for critical only */}
      {isCritical && (
        <div style={{
          position: "absolute", inset: 0,
          borderRadius: "50%",
          border: `1.5px solid ${palette.glow}`,
          pointerEvents: "none",
          mixBlendMode: "screen",
          animation: "pulse-ring 2s ease-out infinite",
        }} />
      )}

      {/* core lantern */}
      <div style={{
        position: "absolute", inset: 0,
        borderRadius: "50%",
        background: `radial-gradient(circle at 35% 32%, #ffffff 0%, ${palette.core} 38%, ${palette.glow} 78%, ${palette.glow}aa 100%)`,
        boxShadow: `0 0 ${baseSize * 0.7}px ${palette.glow}aa, inset 0 0 ${baseSize * 0.3}px rgba(255,255,255,0.55)`,
        display: "grid", placeItems: "center",
        opacity: isQuiet ? 0.78 : 1,
        animation: isAttention ? "breathe 3.5s ease-in-out infinite" : (isQuiet ? "breathe 7s ease-in-out infinite" : "breathe 5s ease-in-out infinite"),
      }}>
        {/* initial */}
        <div style={{
          fontWeight: 600, fontSize: baseSize * 0.32,
          color: "rgba(58,46,48,0.7)",
          textShadow: `0 0 6px ${palette.core}, 0 0 1px rgba(255,255,255,0.9)`,
        }}>
          {client.name.split(" ").map(n => n[0]).join("")}
        </div>
      </div>

      {/* label below */}
      <div style={{
        position: "absolute", left: "50%", top: "100%", marginTop: 8,
        transform: "translateX(-50%)",
        textAlign: "center", whiteSpace: "nowrap",
        pointerEvents: "none",
        opacity: isQuiet ? 0.6 : 0.95,
        transition: "opacity 200ms",
      }}>
        <div style={{
          fontWeight: 500, fontSize: 11, letterSpacing: 0.15,
          color: "#3a2e30",
          textShadow: "0 1px 4px rgba(255,235,222,0.6)",
        }}>
          {client.name}
        </div>
        <div style={{
          fontSize: 8.5, letterSpacing: 0.6, marginTop: 1,
          color: isCritical ? palette.glow : (isAttention ? "#a07a4a" : "#768596"),
          fontWeight: isCritical || isAttention ? 600 : 500,
          textTransform: "uppercase",
        }}>
          {client.niche}
        </div>
      </div>
    </div>
  );
}

        <div style={{

          fontSize: 8.5, letterSpacing: 1.5, fontWeight: 600,
          textTransform: "uppercase", color: toneColor,
        }}>
          <span style={{
            width: 5, height: 5, borderRadius: "50%",
            background: toneColor, boxShadow: `0 0 6px ${toneColor}`,
          }} />
          {eyebrow}
        </div>
        <div style={{
          marginTop: 3,
          fontWeight: 700, fontSize: 13.5, lineHeight: 1.2,
          color: "#2D0E0E", letterSpacing: -0.2, textWrap: "pretty",
          whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
        }}>

// ── Orbital field — agency in center, clients around. Viewport-aware. ──
function OrbitalField() {
  const stageRef = useRef(null);
  const [hovered, setHovered] = useState(null);
  const [vp, setVp] = useState({ w: 1200, h: 800 });

  useEffect(() => {
    const measure = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  // Layout: top card row + chrome ≈ 110px. Bottom: ribbon (b:140) + chat
  // column ≈ 180px. Orbital field gets what's between.
  const topPad = 110;
  const botPad = 180;
  const sidePad = 24;
  const innerW = Math.max(360, vp.w - 64 - sidePad * 2);
  const innerH = Math.max(220, vp.h - topPad - botPad);

  // Use a higher squash so vertical orbit room is sufficient and inner
  // clearance can be reasonable. (At very low squash, clearance forces
  // ring0 to be huge → outer ring overflows the height budget.)
  const squash = 0.55;
  // The outer ring's vertical extent is the binding constraint. To keep
  // this from cascading into a circular dependency, assume the worst-case
  // ring0 (∼0.8/squash + small clientBase term) when computing the budget.
  const worstRing0 = 0.8 / squash + 0.5;     // ≈ 1.95 at squash=0.55
  const worstRing2 = worstRing0 + 0.95;       // ≈ 2.90
  const orbHalf = 22;
  const labelPad = 22;
  const agencyRByH = (innerH / 2 - orbHalf - labelPad) / (worstRing2 * squash);
  const agencyRByW = (innerW / 2 - orbHalf - 30) / worstRing2;
  const agencyR = Math.max(38, Math.min(110, Math.min(agencyRByH, agencyRByW)));
  const agencySize = agencyR * 1.6;
  const clientBase = Math.max(28, Math.min(46, agencyR * 0.38));

  // Innermost orbit must clear the agency orb at ALL angles. The squashed
  // ellipse pulls clients CLOSEST to the agency center at θ=90°/270°
  // (the minor-axis tips) — there the actual screen distance is
  // radial · squash, not radial. So ring0 must satisfy:
  //   agencyR · ring0 · squash  ≥  agencyR · 0.8 + clientBase/2 + gap
  // (agencyR · 0.8 ≈ agency-orb outer radius, since agencySize = agencyR · 1.6)
  const innerClearance = agencyR * 0.8 + clientBase / 2 + 14;
  const minRing0 = innerClearance / (agencyR * squash);
  const ring0 = Math.max(1.5, minRing0);
  const ring1 = ring0 + 0.45;
  const ring2 = ring0 + 0.95;
  const rings = [
    { mul: ring0, label: "ACTIVE TODAY" },
    { mul: ring1, label: "THIS WEEK"    },
    { mul: ring2, label: "QUIETER"      },
  ];
  const radialFor = (orig) => orig < 1.7 ? ring0 : orig < 2.1 ? ring1 : ring2;

  return (
    <div ref={stageRef} style={{
      position: "absolute",
      left: sidePad, right: sidePad,
      top: topPad, bottom: botPad,
      display: "grid", placeItems: "center",
      pointerEvents: "none",
    }}>
      <div style={{ position: "relative", width: 0, height: 0, pointerEvents: "auto" }}>
        {/* orbital rings */}
        <svg
          width="1200" height="900"
          viewBox="-600 -450 1200 900"
          style={{ position: "absolute", left: -600, top: -450, pointerEvents: "none", overflow: "visible" }}
        >
          {rings.map((ring, i) => {
            const rx = agencyR * ring.mul;
            const ry = rx * squash; // match the orbital plane the orbs sit on
            return (
              <g key={i} style={{ opacity: 0.4 }}>
                <ellipse
                  cx={0} cy={0} rx={rx} ry={ry}
                  fill="none"
                  stroke="rgba(154,141,138,0.32)"
                  strokeWidth="0.8"
                  strokeDasharray="2 6"
                />
                <text
                  x={rx - 8} y={3}
                  textAnchor="end"
                  fontFamily="'Space Grotesk', system-ui, sans-serif"
                  fontSize="9" fontWeight="500" letterSpacing="2.2"
                  fill="rgba(154,141,138,0.55)"
                  style={{ filter: "drop-shadow(0 0 3px rgba(45,42,42,0.85))" }}
                >
                  {ring.label}
                </text>
              </g>
            );
          })}
        </svg>

        {/* Agency orb at center */}
        <div style={{
          position: "absolute", left: -agencySize / 2, top: -agencySize / 2,
        }}>
          <AgencyOrb size={agencySize} />
        </div>

        {/* Client orbs */}
        {CLIENTS.map(c => {
          const rad = (c.angle * Math.PI) / 180;
          const dist = agencyR * radialFor(c.radial);
          const x = Math.cos(rad) * dist;
          const y = Math.sin(rad) * dist * squash;
          return (
            <ClientOrb
              key={c.id}
              client={c}
              x={x} y={y}
              base={clientBase}
              hovered={hovered === c.id}
              onHover={setHovered}
              onLeave={() => setHovered(null)}
            />
          );
        })}
      </div>
    </div>
  );
}
